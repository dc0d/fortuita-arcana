name: Tag version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: needed for the monotonicity guard and the
          # changelog message built from the previous tag.
          fetch-depth: 0

      - name: Read and verify manifest version
        id: version
        run: |
          version="$(python3 scripts/version.py check)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/tag-version.sh "$VERSION"
